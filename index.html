<script>
/* =====================================================================
   DATA — läs strukturen
   Separate from index.html so the compound list can be edited on its own.

   Peptides are NOT written as SMILES by hand. They are given as residue
   lists and built into a structure by byggPeptid() below, which means the
   drawing can never drift from the sequence. The builder was checked
   against known masses: DRVYIHPF comes out at 1046 (angiotensin II) and
   YGGFL at 556 (leu-enkefalin).
   ===================================================================== */

/* ---- amino acid side chains, as written from the alpha carbon ---- */
const SIDO = {
  G: null,                      A: 'C',                 V: 'C(C)C',
  L: 'CC(C)C',                  I: '[C@@H](C)CC',       F: 'Cc1ccccc1',
  Y: 'Cc1ccc(O)cc1',            W: 'Cc1c[nH]c2ccccc12', S: 'CO',
  T: '[C@@H](C)O',              C: 'CS',                M: 'CCSC',
  N: 'CC(N)=O',                 Q: 'CCC(N)=O',          D: 'CC(O)=O',
  E: 'CCC(O)=O',                K: 'CCCCN',             R: 'CCCNC(N)=N',
  H: 'Cc1c[nH]cn1',
  // beyond the twenty — these are the giveaway that a ribosome was not involved
  Orn: 'CCCN',                  Abu: 'CC',              Nva: 'CCC',
  Aad: 'CCCC(O)=O'
};
const AA_NAMN = {
  G:'glycin', A:'alanin', V:'valin', L:'leucin', I:'isoleucin', F:'fenylalanin',
  Y:'tyrosin', W:'tryptofan', S:'serin', T:'treonin', C:'cystein', M:'metionin',
  N:'asparagin', Q:'glutamin', D:'asparaginsyra', E:'glutaminsyra', K:'lysin',
  R:'arginin', H:'histidin', P:'prolin',
  Orn:'ornitin', Abu:'α-aminosmörsyra', Nva:'norvalin', Aad:'aminoadipinsyra'
};

/* beta-D-glucopyranose as a substituent, attached through whatever atom ends the side
   chain: the oxygen of serine or threonine (an O-glycoside) or the sulfur of cysteine
   (an S-glycoside, which is what sublancin actually carries). */
const SOCKER = '[C@@H]1O[C@H](CO)[C@@H](O)[C@H](O)[C@H]1O';

/* One residue, written from its nitrogen to its carbonyl carbon.
   o.d = D-form, o.nme = methyl on the backbone nitrogen, o.gly = sugar on the side
   chain, o.dha = dehydroalanine (a double bond where the alpha hydrogen should be).
   o.ss = a ring-closure number appended to the side chain; two residues sharing a
   number are bonded through whatever atom their side chain ends in. Two cysteines
   give a disulfide (S–S); a cysteine and an alanine give a lanthionine thioether
   bridge (CH2–S–CH2), because the alanine closes the ring from its beta carbon. */
function rest(kod, o) {
  o = o || {};
  const kiral = o.d ? '[C@H]' : '[C@@H]';
  const N = o.nme ? 'N(C)' : 'N';
  if (o.dha) return N + 'C(=C)C(=O)';
  if (kod === 'P') return o.d ? 'N1CCC[C@@H]1C(=O)' : 'N1CCC[C@H]1C(=O)';
  if (kod === 'G') return N + 'CC(=O)';
  let sid = SIDO[kod];
  if (sid == null) return N + 'CC(=O)';
  if (o.gly) sid = sid + SOCKER;
  if (o.ss) sid = sid + '%' + o.ss;
  return N + kiral + '(' + sid + ')C(=O)';
}
/* opt.per = per-residue options keyed by index, opt.amid = amidated C-terminus,
   opt.pyro = pyroglutamate at the N-terminus, opt.cyklisk = head-to-tail ring. */
function byggPeptid(seq, opt) {
  opt = opt || {};
  const per = opt.per || {};
  let s = '';
  seq.forEach((k, idx) => {
    if (idx === 0 && opt.pyro) { s += 'O=C1CC[C@H](N1)C(=O)'; return; }   // pyroglutamat
    let bit = rest(k, per[idx]);
    if (idx === 0 && opt.cyklisk) bit = bit.replace(/^N(\(C\))?/, m => m + '%90');
    s += bit;
  });
  if (opt.cyklisk) return s.replace(/C\(=O\)$/, 'C%90=O');
  return s + (opt.amid ? 'N' : 'O');
}

/* =====================================================================
   THE FIVE CLASSES
   ===================================================================== */
const KLASSER = {
  /* `tecken` is deliberately terse: the reminder has to fit on screen without scrolling, and a
     student who has forgotten the difference needs a prompt, not a lecture. */
  PKS1: { namn: 'Polyketid, PKS typ I', kort: 'stor böjlig ring',
    tecken: ['sluten med en <b>ester</b>', 'syre och metyler utmed kedjan', 'inga amidbindningar'] },
  PKS2: { namn: 'Polyketid, PKS typ II', kort: 'platt och styv',
    tecken: ['<b>hopvuxna aromatiska ringar</b>, ofta en kinon', 'aldrig en stor böjlig ring'] },
  NRPS: { namn: 'Icke-ribosomal peptid (NRPS)', kort: 'ser knappt ut som en peptid alls',
    tecken: ['<b>tvärbundna ringar, socker, klor</b>', '<b>metylerade kväven</b> — och då många',
             '<b>ester</b> i kedjan där amid borde stå', 'β-laktam eller svavelring'] },
  RIB:  { namn: 'Ribosomal peptid', kort: 'peptid — och det är allt',
    tecken: ['rak kedja, fria ändar', 'bara vanliga byggstenar'] },
  RIPP: { namn: 'Ribosomal peptid med PTM (RiPP)', kort: 'vanliga byggstenar, men ihopknuten',
    tecken: ['<b>disulfidbrygga</b> mellan två cysteiner', 'eller <b>ringsluten</b> ände mot ände'] }
};
/* Only two PTMs are taught here, named in one place so the key, the prompt and the data cannot
   drift apart. Note what this costs: a closed ring is no longer evidence of an NRPS, since a
   RiPP can be cyclic too. What separates them is the BUILDING BLOCKS — an NRPS peptide contains
   things a ribosome cannot load, a RiPP is ordinary amino acids that were tied together after.
   Two compounds whose only tell was the ring (gramicidin S, tyrocidin A) were dropped for that
   reason: under these rules a student would correctly read them as RiPPs. */
const PTM_LISTA = 'en disulfidbrygga eller en ring sluten ände mot ände';
const KLASSORDNING = ['PKS1', 'PKS2', 'NRPS', 'RIB', 'RIPP'];

/* Evidence is found with substructure search, not hand-mapped atom lists: a new structure
   costs a SMILES and a class, not an atom map. `plocka` says which atoms OF THE MATCH are
   the evidence, so a single N-methyl amide lights up the methyl and its nitrogen rather
   than a five-atom blob. */
const BEVIS = {
  nmetyl:     { namn: 'Metylerat ryggradskväve', smarts: '[CH3][NX3]([#6])[CX3]=[OX1]', plocka: [0, 1], klass: 'NRPS' },
  // an ester whose alcohol carbon carries its own carbonyl — i.e. a hydroxy acid sitting in a
  // backbone where an amino acid should be. Specific enough to leave plain macrolactones alone.
  depsi:      { namn: 'Esterbindning i peptidkedjan', smarts: '[CX3](=[OX1])[OX2H0][CX4][CX3]=[OX1]', plocka: [0, 1, 2], klass: 'NRPS' },
  betalaktam: { namn: 'β-laktamring',           smarts: 'O=[CX3;R]1[NX3;R][CX4;R][CX4;R]1', klass: 'NRPS' },
  kloraryl:   { namn: 'Klorerad aromatisk ring', smarts: '[Cl][c]',                     plocka: [0],    klass: 'NRPS' },
  // narrowed from "any ring sulfur" once the lanthionine bridge below became a RiPP marker:
  // sulfur sharing a five-ring with a nitrogen is a thiazole/thiazoline, which no RiPP here has.
  // Matches bacitracin's thiazoline and penicillin's thiazolidine, both S-C-N-C-C around the ring.
  tiazol:     { namn: 'Tiazolring — svavel och kväve i samma ring', smarts: '[#16X2;R]1[#6;R][#7;R][#6;R][#6;R]1', klass: 'NRPS' },
  disulfid:   { namn: 'Disulfidbrygga',          smarts: '[#16X2H0][#16X2H0]',          plocka: [0, 1], klass: 'RIPP' },
  // lanthionine: one sulfur bridging two CH2 groups. Methionine is excluded because its sulfur
  // sits next to a CH3, and the thiazoles above because theirs sit next to ring carbons.
  tioeterbrygga: { namn: 'Tioeterbrygga (lantionin)', smarts: '[CX4H2][#16X2H0][CX4H2]', plocka: [0, 1, 2], klass: 'RIPP' },
  // the glycosidic bond: a ring carbon bearing both its own ring oxygen and an exocyclic
  // O or S that leads out to the peptide.
  glykosid:   { namn: 'Påhängt socker (glykosidbindning)', smarts: '[CX4;R]([OX2;R])[OX2H0,SX2H0;!R][CX4;!R]', plocka: [1, 2], klass: 'RIPP' },
  lakton:     { namn: 'Makrolakton (ringester)', smarts: '[CX3;R](=[OX1])[OX2;R][#6;R]', plocka: [0, 1, 2], klass: 'PKS1' },
  // a para-quinone written out in full. "Any ring carbonyl" also lit up the lactone in every
  // macrolide, which would have taught the opposite of the point.
  kinon:      { namn: 'Kinon', smarts: '[#6;R]1(=[OX1])[#6;R]=,:[#6;R][#6;R](=[OX1])[#6;R]=,:[#6;R]1', plocka: [0, 1, 4, 5], klass: 'PKS2' }
};

/* =====================================================================
   UPPGIFTER
   `smiles` for real natural products, `seq` for peptides that are built.
   The compound is never named to the student — `facit` explains the reasoning.
   ===================================================================== */
const UPPGIFTER = [

/* ---------- PKS typ I: macrolides, polyenes, polyethers ---------- */
{ id:'pk1-amfo', klass:'PKS1', bevis:['lakton'], smiles:'C[C@H]1/C=C/C=C/C=C/C=C/C=C/C=C/C=C/[C@@H](C[C@H]2[C@@H]([C@H](C[C@](O2)(C[C@H](C[C@H]([C@@H](CC[C@H](C[C@H](CC(=O)O[C@H]([C@@H]([C@@H]1O)C)C)O)O)O)O)O)O)O)C(=O)O)O[C@H]3[C@H]([C@H]([C@@H]([C@H](O3)C)O)N)O',
  facit:'En stor ring sluten med en ester, en lång rad konjugerade dubbelbindningar på ena sidan och en rad OH-grupper på den andra. Kedjan är byggd av acetat och sedan reducerad olika mycket på olika ställen — det är precis vad ett modulärt PKS gör. Sockret är påhängt efteråt.' },
{ id:'pk1-nyst', klass:'PKS1', bevis:['lakton'], smiles:'C[C@H]1/C=C/C=C/CC/C=C/C=C/C=C/C=C/C(CC2C(C(C[C@](O2)(CC(C(CCC(CC(CC(CC(=O)O[C@H]([C@@H]([C@@H]1O)C)C)O)O)O)O)O)O)O)C(=O)O)O[C@@H]3[C@H]([C@H]([C@@H]([C@H](O3)C)O)N)O',
  facit:'Samma mönster som föregående: makrolakton, polyendel, polyoldel och ett aminosocker. De två skiljer sig bara i hur många dubbelbindningar som sitter i rad.' },
{ id:'pk1-eryt', klass:'PKS1', bevis:['lakton'], smiles:'CC[C@@H]1[C@@]([C@@H]([C@H](C(=O)[C@@H](C[C@@]([C@@H]([C@H]([C@@H]([C@H](C(=O)O1)C)O[C@H]2C[C@@]([C@H]([C@@H](O2)C)O)(C)OC)C)O[C@H]3[C@@H]([C@H](C[C@H](O3)C)N(C)C)O)(C)O)C)C)O)(C)O',
  facit:'Ringen är sluten med en ester och bär metylgrupper med jämna mellanrum — varje metyl kommer från en propionatenhet i stället för acetat. Två socker är påhängda efteråt.' },
{ id:'pk1-oleand', klass:'PKS1', bevis:['lakton'], smiles:'C[C@@H]1C[C@@H]([C@H]([C@@H](O1)O[C@H]2[C@H](C[C@@]3(CO3)C(=O)[C@@H]([C@H]([C@H]([C@H](OC(=O)[C@@H]([C@H]([C@@H]2C)O[C@H]4C[C@@H]([C@H]([C@@H](O4)C)O)OC)C)C)C)O)C)C)O)N(C)C',
  facit:'En fjortonledad makrolakton med två socker. Epoxiden är tillagd efteråt av ett eget enzym — men ringen och metylerna avslöjar polyketiden.' },
{ id:'pk1-tylo', klass:'PKS1', bevis:['lakton'], smiles:'CC[C@@H]1[C@H](/C=C(/C=C/C(=O)[C@@H](C[C@@H]([C@@H]([C@H]([C@@H](CC(=O)O1)O)C)O[C@H]2[C@@H]([C@H]([C@@H]([C@H](O2)C)O[C@H]3C[C@@]([C@H]([C@@H](O3)C)O)(C)O)N(C)C)O)CC=O)C)\\C)CO[C@H]4[C@@H]([C@@H]([C@@H]([C@H](O4)C)O)OC)OC',
  facit:'Makrolakton med tre påhängda socker och en aldehydgrupp. Dubbelbindningarna sitter kvar där modulen hoppade över reduktionssteget.' },
{ id:'pk1-iver', klass:'PKS1', bevis:['lakton'], smiles:'CC[C@H](C)[C@@H]1[C@H](CC[C@@]2(O1)C[C@@H]3C[C@H](O2)C/C=C(/[C@H]([C@H](/C=C/C=C/4\\CO[C@H]5[C@@]4([C@@H](C=C([C@H]5O)C)C(=O)O3)O)C)O[C@H]6C[C@@H]([C@H]([C@@H](O6)C)O[C@H]7C[C@@H]([C@H]([C@@H](O7)C)O)OC)OC)\\C)C',
  facit:'Makrolakton med påhängda socker och en kedja där syret sitter med jämna mellanrum. Flera ringar har bildats inne i molekylen, men grunden är en acetatbyggd kedja.' },
{ id:'pk1-epo', klass:'PKS1', bevis:['lakton'], smiles:'C[C@H]1CCC[C@@]2([C@@H](O2)C[C@H](OC(=O)C[C@@H](C(C(=O)[C@@H]([C@H]1O)C)(C)C)O)/C(=C/C3=CSC(=N3)C)/C)C',
  facit:'Mindre ring än de andra, men samma drag: ester i ringen, metylgrupper utmed kedjan, syre med jämna mellanrum. Tiazolringen i svansen kommer från en NRPS-modul — maskinerierna samarbetar ofta.' },
{ id:'pk1-lova', klass:'PKS1', bevis:['lakton'], smiles:'CC[C@H](C)C(=O)O[C@H]1C[C@H](C=C2[C@H]1[C@H]([C@H](C=C2)C)CC[C@@H]3C[C@H](CC(=O)O3)O)C',
  facit:'En acetatbyggd kedja som veckats till ringar, med en lakton i ena änden. Svampar kör samma modul-set om och om igen i stället för att ha en modul per steg.' },

<script>
/* =====================================================================
   LÄS STRUKTUREN — the structural companion to Upptäcktsresan.
   The module teaches the inference narratively ("ribosomen kan inte bygga
   metylerade ryggradskväven"); here the student makes it on sight.

   Flow, per Luke: a structure comes up unnamed -> say what built it ->
   if it is an NRPS or a RiPP, mark the features that give it away.
   ===================================================================== */

let RDK = null, rdkFel = false;
const svgCache = {}, smilesCache = {};

/* Peptides are stored as residue lists and turned into structures here, so the drawing can
   never drift from the sequence. Everything else carries its own SMILES. */
function smilesFor(u) {
  if (u.smiles) return u.smiles;
  if (smilesCache[u.id]) return smilesCache[u.id];
  return (smilesCache[u.id] = byggPeptid(u.seq, u.opt));
}

function startRDKit() {
  if (typeof window.initRDKitModule === 'undefined') { rdkFel = true; rita(); return; }
  window.initRDKitModule().then(r => { RDK = r; try { r.prefer_coordgen(true); } catch (e) {} rita(); })
    .catch(() => { rdkFel = true; rita(); });
}

/* ---- drawing and atom positions, taken from the old biosynthesis trainer where they are
   well proven. Positions come from three sources in order of reliability: the bounding box of
   a drawn label, clustered bond endpoints for atoms with no label, and an affine fit from the
   molblock for anything still missing. ---- */
let molBonds = [], molCoords = [];
function parseMolblock(mol) {
  molBonds = []; molCoords = [];
  let mb = '';
  try { mb = mol.get_molblock(); } catch (e) { return; }
  const lines = mb.split('\n');
  if (lines.length < 4) return;
  const nAtoms = parseInt(lines[3].substr(0, 3), 10), nBonds = parseInt(lines[3].substr(3, 3), 10);
  if (isNaN(nAtoms) || isNaN(nBonds)) return;
  for (let k = 0; k < nAtoms; k++) {
    const l = lines[4 + k] || '';
    molCoords.push({ x: parseFloat(l.substr(0, 10)), y: parseFloat(l.substr(10, 10)) });
  }
  for (let j = 0; j < nBonds; j++) {
    const l = lines[4 + nAtoms + j] || '';
    const a1 = parseInt(l.substr(0, 3), 10) - 1, a2 = parseInt(l.substr(3, 3), 10) - 1;
    if (!isNaN(a1) && !isNaN(a2)) molBonds.push({ bondIdx: j, a1, a2 });
  }
}
function computeAtomPositions(svg, numAtoms) {
  const pos = new Array(numAtoms).fill(null);
  const boxes = {};
  svg.querySelectorAll('[class]').forEach(el => {
    const cls = el.getAttribute('class') || '';
    if (cls.indexOf('bond-') >= 0) return;
    const m = cls.match(/atom-(\d+)/);
    if (!m) return;
    let bb; try { bb = el.getBBox(); } catch (e) { return; }
    if (!bb || (bb.width === 0 && bb.height === 0)) return;
    const k = +m[1];
    if (!boxes[k]) boxes[k] = { x0: bb.x, y0: bb.y, x1: bb.x + bb.width, y1: bb.y + bb.height };
    else { const g = boxes[k];
      g.x0 = Math.min(g.x0, bb.x); g.y0 = Math.min(g.y0, bb.y);
      g.x1 = Math.max(g.x1, bb.x + bb.width); g.y1 = Math.max(g.y1, bb.y + bb.height); }
  });
  Object.keys(boxes).forEach(k => { const g = boxes[k]; if (+k < numAtoms) pos[+k] = { x: (g.x0 + g.x1) / 2, y: (g.y0 + g.y1) / 2 }; });

  const rawPts = {};
  svg.querySelectorAll('[class*="bond-"]').forEach(el => {
    const bm = (el.getAttribute('class') || '').match(/bond-(\d+)/);
    if (!bm) return;
    const pts = [], d = el.getAttribute('d');
    if (d) { const nums = d.match(/-?\d*\.?\d+/g) || [];
      for (let k = 0; k + 1 < nums.length; k += 2) pts.push({ x: +nums[k], y: +nums[k + 1] }); }
    else if (el.hasAttribute('x1')) {
      pts.push({ x: +el.getAttribute('x1'), y: +el.getAttribute('y1') });
      pts.push({ x: +el.getAttribute('x2'), y: +el.getAttribute('y2') });
    }
    if (pts.length) (rawPts[+bm[1]] = rawPts[+bm[1]] || []).push(...pts);
  });
  const bondEnds = {};
  Object.keys(rawPts).forEach(bi => {
    const pts = rawPts[bi]; let best = null, bd = -1;
    for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) {
      const dd = Math.hypot(pts[a].x - pts[b].x, pts[a].y - pts[b].y);
      if (dd > bd) { bd = dd; best = [pts[a], pts[b]]; }
    }
    if (best) bondEnds[bi] = { p: best, len: bd };
  });
  const lens = Object.values(bondEnds).map(b => b.len).sort((a, b) => a - b);
  const medLen = lens.length ? lens[Math.floor(lens.length / 2)] : 30;
  const thr = Math.max(4, medLen * 0.35);

  const atomPts = Array.from({ length: numAtoms }, () => []);
  molBonds.forEach(b => {
    const be = bondEnds[b.bondIdx]; if (!be) return;
    if (b.a1 < numAtoms) atomPts[b.a1].push(be.p[0], be.p[1]);
    if (b.a2 < numAtoms) atomPts[b.a2].push(be.p[0], be.p[1]);
  });
  for (let k = 0; k < numAtoms; k++) {
    if (pos[k]) continue;
    const pts = atomPts[k]; if (pts.length < 3) continue;
    let seed = null, bestC = 0;
    pts.forEach(p => { const c = pts.filter(q => Math.hypot(p.x - q.x, p.y - q.y) < thr).length;
      if (c > bestC) { bestC = c; seed = p; } });
    if (seed && bestC >= 2) {
      const cl = pts.filter(q => Math.hypot(seed.x - q.x, seed.y - q.y) < thr);
      pos[k] = { x: cl.reduce((s, p) => s + p.x, 0) / cl.length, y: cl.reduce((s, p) => s + p.y, 0) / cl.length };
    }
  }
  for (let pass = 0; pass < 4; pass++) molBonds.forEach(b => {
    [[b.a1, b.a2], [b.a2, b.a1]].forEach(([a, c]) => {
      if (a >= numAtoms || c >= numAtoms || pos[a] || !pos[c]) return;
      const be = bondEnds[b.bondIdx]; if (!be) return;
      const d0 = Math.hypot(be.p[0].x - pos[c].x, be.p[0].y - pos[c].y);
      const d1 = Math.hypot(be.p[1].x - pos[c].x, be.p[1].y - pos[c].y);
      pos[a] = (d0 > d1) ? { x: be.p[0].x, y: be.p[0].y } : { x: be.p[1].x, y: be.p[1].y };
    });
  });
  const known = [];
  for (let k = 0; k < numAtoms; k++) if (pos[k] && molCoords[k]) known.push(k);
  if (known.length >= 3 && known.length < numAtoms) {
    const u = known.map(k => molCoords[k].x), v = known.map(k => -molCoords[k].y);
    const X = known.map(k => pos[k].x), Y = known.map(k => pos[k].y);
    const mean = a => a.reduce((s, n) => s + n, 0) / a.length;
    const ub = mean(u), vb = mean(v), Xb = mean(X), Yb = mean(Y);
    let num = 0, den = 0;
    for (let k = 0; k < known.length; k++) {
      num += (u[k] - ub) * (X[k] - Xb) + (v[k] - vb) * (Y[k] - Yb);
      den += (u[k] - ub) ** 2 + (v[k] - vb) ** 2;
    }
    if (den > 0) {
      const s = num / den, tx = Xb - s * ub, ty = Yb - s * vb;
      for (let k = 0; k < numAtoms; k++) if (!pos[k] && molCoords[k]) pos[k] = { x: s * molCoords[k].x + tx, y: -s * molCoords[k].y + ty };
    }
  }
  return pos;
}
/* every element drawn in black, as in the other trainer — coloured heteroatoms would give the
   answer away before the student has looked at the bonds */
const SVART = { '-1':[0,0,0], '1':[0,0,0], '6':[0,0,0], '7':[0,0,0], '8':[0,0,0], '9':[0,0,0],
  '15':[0,0,0], '16':[0,0,0], '17':[0,0,0], '35':[0,0,0], '53':[0,0,0] };
function ritaMolekyl(smiles) {
  if (svgCache[smiles]) return svgCache[smiles];
  const mol = RDK.get_mol(smiles);
  if (!mol) return null;
  try { mol.set_new_coords(true); } catch (e) {}
  const stor = mol.get_num_atoms() > 55;
  const svg = mol.get_svg_with_highlights(JSON.stringify({
    width: stor ? 1200 : 900, height: stor ? 900 : 675,
    bondLineWidth: stor ? 2 : 2.4, scaleBondWidth: true,
    addChiralHs: false, baseFontSize: .55, atomColourPalette: SVART
  }));
  const n = mol.get_num_atoms();
  mol.delete();
  return (svgCache[smiles] = { svg, n });
}
/* Each SMARTS match is one INSTANCE of a tell. Ciklosporin has seven N-methyls; the student is
   not asked to click all fourteen atoms, only to find an example of each kind of tell. So the
   evidence is kept grouped by instance, and marking any atom of any instance counts as having
   found that kind. The facit still shows every instance, so they see how common it is. */
function bevisInstanser(smiles, nycklar) {
  const ut = [];
  if (!RDK) return ut;
  const mol = RDK.get_mol(smiles);
  if (!mol) return ut;
  (nycklar || []).forEach(k => {
    const b = BEVIS[k]; if (!b) return;
    const q = RDK.get_qmol(b.smarts);
    if (!q) return;
    try {
      JSON.parse(mol.get_substruct_matches(q) || '[]').forEach(t => {
        const a = t.atoms || [];
        const atoms = (b.plocka || a.map((_, n) => n)).map(n => a[n]).filter(x => x !== undefined);
        if (atoms.length) ut.push({ nyckel: k, atoms });
      });
    } catch (e) {}
    q.delete();
  });
  mol.delete();
  return ut;
}
function bevisAtomer(smiles, nycklar) {
  const s = new Set();
  bevisInstanser(smiles, nycklar).forEach(x => x.atoms.forEach(a => s.add(a)));
  return s;
}
/* which kinds of tell the student has found at least one example of */
function hittadeSorter(inst) {
  const sorter = [...new Set(inst.map(x => x.nyckel))];
  return {
    alla: sorter,
    hittade: sorter.filter(k => inst.some(x => x.nyckel === k && x.atoms.some(a => markerade.has(a))))
  };
}

/* ============================ state ============================ */
let vy = 'ova', kon = [], i = 0, fas = 'klass', vald = null;
let markerade = new Set(), visatFacit = false, resultat = [], nyckelOppen = false;
const blanda = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const nu = () => kon[i];
/* Only the two peptide classes get the marking step. For a polyketide the shape of the whole
   molecule is the answer, and asking the student to click the lactone adds nothing; for a plain
   ribosomal peptide there is by definition nothing to find. */
const MARKKLASSER = ['NRPS', 'RIPP'];
const markerbar = u => MARKKLASSER.includes(u.klass) && (u.bevis || []).length > 0;
function nyOmgang() { kon = blanda(UPPGIFTER); i = 0; nollstall(); resultat = []; rita(); }
function nollstall() { fas = 'klass'; vald = null; markerade = new Set(); visatFacit = false; }

/* ============================ render ============================ */
const app = document.getElementById('app');
function rita() {
  ritaNyckel();
  if (vy === 'granska') return ritaGranska();
  if (!kon.length) return ritaStart();
  if (i >= kon.length) return ritaSlut();
  ritaUppgift();
}

function ritaStart() {
  app.innerHTML = `<div class="card">
    <h1>Läs strukturen</h1>
    <p>Du får se en molekyl utan namn. Frågan är alltid densamma: <b>vilket maskineri byggde den?</b>
    Svaret står i strukturen — du behöver aldrig känna igen föreningen.</p>
    <p>Är det en icke-ribosomal peptid eller en RiPP får du sedan <b>peka ut det som avslöjar den</b>
    genom att klicka i strukturen.</p>
    <p class="small muted">Det här är den strukturella sidan av Upptäcktsresan. Där följer du hur ett
    läkemedel hittades; här övar du på att läsa av biosyntesen direkt ur molekylen.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nyOmgang()">▶ Börja öva (${UPPGIFTER.length} strukturer)</button>
      <button class="btn" onclick="vaxlaNyckel()">🔑 Visa nyckeln</button>
    </div>
  </div>`;
}

function ritaUppgift() {
  const u = nu();
  app.innerHTML = `<div class="card">
    <div class="rakna">Struktur ${i + 1} av ${kon.length}</div>
    <div class="ovning">
      <div>${ritrutaHTML(u)}</div>
      <div id="hoger">${hogerHTML(u)}</div>
    </div>
  </div>`;
  if (fas === 'mark') kopplaHitbox(u);
}

function hogerHTML(u) {
  if (fas === 'klass') return `<h2>Vilket maskineri byggde den här molekylen?</h2>${valHTML()}`;
  const ratt = vald === u.klass;
  const facit = `<div class="svar ${ratt ? 'ok' : 'bad'}">
      <b>${ratt ? '✅ Rätt.' : '❌ Inte riktigt.'}</b> Det här är <b>${KLASSER[u.klass].namn}</b>.
      <div style="margin-top:.5rem">${u.facit}</div></div>`;
  if (fas === 'klar') return facit + knappar(u);
  const inst = bevisInstanser(smilesFor(u), u.bevis);
  const { alla, hittade } = hittadeSorter(inst);
  const namnFor = k => (BEVIS[k] && BEVIS[k].namn) || k;
  return facit + `<div class="leta">
      <b>Peka ut det som avslöjar den.</b> ${u.klass === 'RIPP'
        ? `Klicka på en ändring som gjorts <i>efter</i> ribosomen. Det är alltid någon av fyra: ${PTM_LISTA}.`
        : 'Klicka på något i strukturen som gör att den <i>inte</i> kan ha byggts på en ribosom.'}
      <div class="small muted" style="margin-top:.3rem">Du behöver inte markera allt — det räcker med
      <b>ett exempel</b> på varje sorts tecken. Klicka på en atom i det du menar.</div>
      ${visatFacit
        ? `<div style="margin-top:.5rem">Facit: ${alla.map(k => `<b>${namnFor(k)}</b>`).join(' och ')} —
            ${inst.length === alla.length ? 'ett ställe' : `${inst.length} ställen`} i molekylen, alla
            markerade. Grönt är det du hittade, streckat är de övriga, rött är felklick.</div>`
        : `<div class="poang">
            <span>hittade: <b>${hittade.length}</b> av ${alla.length} sorters tecken</span>
            ${hittade.length ? `<span class="muted">${hittade.map(namnFor).join(', ')}</span>` : ''}
          </div>`}
    </div>` + knappar(u);
}
function knappar(u) {
  return `<div class="btn-row">
    ${fas === 'mark' && !visatFacit ? `<button class="btn" onclick="visaFacitMark()">Visa facit</button>` : ''}
    <button class="btn btn-primary" onclick="nasta()">${i + 1 < kon.length ? 'Nästa ➔' : 'Se resultatet ➔'}</button>
    <button class="btn" onclick="vaxlaNyckel()">🤔 Påminn mig</button>
  </div>`;
}
/* Just the name on the button. The tells live behind the key, so that answering means reading
   the structure rather than matching the structure against a hint printed next to the answer. */
/* Just the name on the button, each in its own colour. The tells sit behind the last button in
   the same box, so the reminder is where the student is already looking — and so the six
   together fill the same height as the structure beside them. */
function valHTML() {
  return `<div class="val">${KLASSORDNING.map(k =>
    `<button class="alt k-${k}" data-k="${k}"><b><span class="prick"></span>${KLASSER[k].namn}</b></button>`).join('')}
    <button class="alt alt-hjalp" onclick="vaxlaNyckel()"><b>🤔 Jag har glömt — påminn mig om skillnaderna</b></button></div>`;
}

function ritrutaHTML(u) {
  if (rdkFel) return `<div class="card small muted">Strukturen kunde inte ritas. Kontrollera internetanslutningen och ladda om sidan.</div>`;
  if (!RDK) return `<div class="ritruta"></div>`;
  const r = ritaMolekyl(smilesFor(u));
  if (!r) return `<div class="card small muted">Strukturen kunde inte ritas.</div>`;
  return `<div class="ritruta" id="ritruta">${r.svg}</div>`;
}
/* positions need the drawing to be in the document (getBBox measures laid-out elements), so the
   hitboxes go on after the SVG has been inserted, not while building the string */
function kopplaHitbox(u) {
  if (!RDK || rdkFel) return;
  const smi = smilesFor(u);
  const r = ritaMolekyl(smi), box = document.getElementById('ritruta');
  if (!r || !box) return;
  const svg = box.querySelector('svg');
  if (!svg) return;
  const mol = RDK.get_mol(smi);
  if (!mol) return;
  try { mol.set_new_coords(true); } catch (e) {}
  parseMolblock(mol);
  mol.delete();
  const pos = computeAtomPositions(svg, r.n);
  const ns = 'http://www.w3.org/2000/svg';
  const facit = visatFacit ? bevisAtomer(smi, u.bevis) : null;
  pos.forEach((p, idx) => {
    if (!p) return;
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', r.n > 55 ? 13 : 11);
    c.setAttribute('fill', 'transparent');
    c.setAttribute('class', 'hitbox' + klassFor(idx, facit));
    if (!facit) c.addEventListener('click', () => {
      markerade.has(idx) ? markerade.delete(idx) : markerade.add(idx);
      ritaUppgift();
    });
    svg.appendChild(c);
  });
}
function klassFor(idx, facit) {
  if (!facit) return markerade.has(idx) ? ' vald' : '';
  const v = markerade.has(idx), f = facit.has(idx);
  return v && f ? ' ratt' : v && !f ? ' fel' : !v && f ? ' missad' : '';
}

/* ---- flow ---- */
document.addEventListener('click', e => {
  const alt = e.target.closest('.alt[data-k]');
  if (alt && fas === 'klass') {
    const u = nu();
    vald = alt.dataset.k;
    resultat.push({ id: u.id, klass: u.klass, ratt: vald === u.klass });
    fas = markerbar(u) ? 'mark' : 'klar';
    ritaUppgift();
    return;
  }
  const tab = e.target.closest('.tab[data-vy]');
  if (tab) {
    vy = tab.dataset.vy;
    document.querySelectorAll('.tab[data-vy]').forEach(t => t.classList.toggle('on', t === tab));
    rita();
  }
});
function visaFacitMark() { visatFacit = true; ritaUppgift(); }
function nasta() { i++; nollstall(); rita(); }

function ritaSlut() {
  const r = resultat.filter(x => x.ratt).length;
  const perKlass = KLASSORDNING.map(k => {
    const d = resultat.filter(x => x.klass === k);
    return d.length ? `<tr><td>${KLASSER[k].namn}</td><td>${d.filter(x => x.ratt).length} av ${d.length}</td></tr>` : '';
  }).join('');
  app.innerHTML = `<div class="card">
    <h1>${r} av ${resultat.length} rätt</h1>
    <table class="granska"><tbody>${perKlass}</tbody></table>
    <div class="btn-row"><button class="btn btn-primary" onclick="nyOmgang()">↺ Kör igen</button>
    <a class="btn" href="../bacteria/index.html">Tillbaka till modulen</a></div>
  </div>`;
}

/* ---- the key: what to look for, available at any time ---- */
function vaxlaNyckel() { nyckelOppen = !nyckelOppen; ritaNyckel(); }
function ritaNyckel() {
  const plats = document.getElementById('nyckelplats');
  if (!nyckelOppen) { plats.innerHTML = ''; return; }
  plats.innerHTML = `<div class="nyckel-bak" onclick="if(event.target===this)vaxlaNyckel()"><div class="nyckel">
    <div style="display:flex;align-items:center;gap:1rem">
      <h2 style="margin:0">🤔 Skillnaderna — vad du ska leta efter</h2>
      <button class="btn" style="margin-left:auto" onclick="vaxlaNyckel()">✕ Stäng</button>
    </div>
    ${KLASSORDNING.map(k => `<div class="nyckel-rad k-${k}">
      <h3><span class="prick"></span>${KLASSER[k].namn} <span class="muted small">— ${KLASSER[k].kort}</span></h3>
      <div class="small tecken">${KLASSER[k].tecken.join('<span class="sep">·</span>')}</div>
    </div>`).join('')}
  </div></div>`;
}

/* ============================ granska (för Luke) ============================ */
function ritaGranska() {
  const rader = UPPGIFTER.map(u => {
    const smi = smilesFor(u);
    const n = (u.bevis || []).length && RDK ? bevisAtomer(smi, u.bevis).size : 0;
    let atomer = '–';
    if (RDK) { const m = RDK.get_mol(smi); if (m) { atomer = m.get_num_atoms(); m.delete(); } else atomer = '<b style="color:var(--bad)">PARSE-FEL</b>'; }
    return `<tr><td>${u.id}</td><td>${u.seq ? 'byggd peptid' : 'struktur'}</td><td>${KLASSER[u.klass].namn}</td>
      <td>${(u.bevis || []).join(', ') || '–'}</td><td>${n}</td><td>${atomer}</td></tr>`;
  }).join('');
  const antal = KLASSORDNING.map(k => `${KLASSER[k].namn}: <b>${UPPGIFTER.filter(u => u.klass === k).length}</b>`).join(' · ');
  app.innerHTML = `<div class="card">
    <h1>Granska</h1>
    <p class="small">${antal} — totalt <b>${UPPGIFTER.length}</b>.</p>
    <p class="small">Facit för markeringarna <b>räknas fram</b> med substruktursökning (SMARTS), inte för hand.
    Tabellen visar hur många atomer sökningen träffar i varje struktur, så att du kan se om den träffar rätt.
    Peptiderna byggs ur sina sekvenser i <code>data.js</code>, så ritningen kan aldrig glida isär från sekvensen.</p>
    <table class="granska"><thead><tr><th>id</th><th>typ</th><th>klass</th><th>bevis</th><th>facit (atomer)</th><th>storlek</th></tr></thead>
    <tbody>${rader}</tbody></table>
    <h2 style="margin-top:1.2rem">Mönstren</h2>
    <table class="granska"><thead><tr><th>nyckel</th><th>namn</th><th>SMARTS</th><th>klass</th></tr></thead><tbody>
    ${Object.entries(BEVIS).map(([k, b]) => `<tr><td>${k}</td><td>${b.namn}</td><td><code>${b.smarts.replace(/</g, '&lt;')}</code></td><td>${b.klass}</td></tr>`).join('')}
    </tbody></table>
    <h2 style="margin-top:1.2rem">Byggda peptider som SMILES</h2>
    <p class="small muted">Så här ser de genererade strukturerna ut, om du vill kontrollera någon av dem i ett ritprogram.</p>
    <textarea readonly>${UPPGIFTER.filter(u => u.seq).map(u => `${u.id}\t${u.seq.join('-')}\t${smilesFor(u)}`).join('\n')}</textarea>
  </div>`;
}

startRDKit();
rita();
</script>
</body>
